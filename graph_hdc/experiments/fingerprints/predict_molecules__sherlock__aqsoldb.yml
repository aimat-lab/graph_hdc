# PyComex configuration file for AqSolDB dataset Sherlock-fingerprint experiments
pycomex: true

extend: predict_molecules__sherlock.py

name: sherlock_aqsoldb

description: |
  Sherlock-fingerprint (entropy-ranked, collision-free Morgan; SPECTRE, Xu et al.
  2026) molecular property prediction on the AqSolDB dataset.

  AqSolDB is a regression dataset for aqueous solubility prediction.

  Native paper configuration (radius 6, 16384 bits). For a size-matched comparison
  against the Morgan / HDF columns, override FINGERPRINT_SIZE on the command line
  (e.g. FINGERPRINT_SIZE=2048). Set SHERLOCK_DICTIONARY_PATH to a dictionary fit on
  the external corpus (COCONUT+LOTUS) for paper-faithful results; otherwise the
  dictionary is fit on this dataset's training split (leakage-safe fallback).

parameters:
  DATASET_NAME: "aqsoldb"
  DATASET_NAME_ID: "aqsoldb"
  DATASET_TYPE: "regression"
  NUM_TEST: 1000
  FINGERPRINT_SIZE: 16384
  SHERLOCK_RADIUS: 6
  SHERLOCK_DICTIONARY_PATH: "/media/ssd2/Programming/graph_hdc/data/sherlock/sherlock_r6_coconut_lotus_dict.pkl"
  MODELS: ["neural_net"]
